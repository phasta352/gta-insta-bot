name: The Leonida Daily bot

on:
  # Runs are started by the Cloudflare Worker (every :07 and :37, and right after you
  # press a Telegram button). To go back to GitHub's own timer, put these lines back:
  # schedule:
  #   - cron: "7,37 6-21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options: [run, check, scout, remake-reel]
        default: run
      draft_id:
        description: "remake-reel only: the post's id (from state.json)"
        required: false
        default: ""
      music:
        description: "remake-reel only: part of a music file name in assets/music (empty = automatic)"
        required: false
        default: ""

permissions:
  contents: write    # needed to save the bot's memory (state/state.json)

concurrency:
  group: gta-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # newest commit when the run starts (not when it was requested),
                                        # so the bot always sees the latest memory

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -q -r requirements.txt
          pip install -q googlenewsdecoder || echo "optional Google News link decoder not installed"

      - name: ffmpeg (for Reels)
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Headline font (optional)
        run: |
          [ -f assets/fonts/Anton-Regular.ttf ] || \
          curl -sfL -o assets/fonts/Anton-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || true

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_TOKEN: ${{ secrets.INSTAGRAM_APP_TOKEN }}
          TELEGRAM_BOT_ID: ${{ secrets.TELEGRAM_BOT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m bot.main "${{ github.event.inputs.mode || 'run' }}" "${{ github.event.inputs.draft_id }}" "${{ github.event.inputs.music }}"

      - name: Save memory
        if: always()
        run: |
          git config user.name "cycling-bot"
          git config user.email "cycling-bot@users.noreply.github.com"
          git add state/state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "bot: update state [skip ci]"
          git pull -q --rebase -X theirs && git push -q   # on a clash, keep this run's (newer) memory
